name: Package Module
on: [push, workflow_dispatch]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Read version
      id: ver
      run: echo "version=$(grep '^version=' module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"
    - name: Build module ZIP
      run: |
        NAME="VollaFlashDual-${{ steps.ver.outputs.version }}.zip"
        zip -r9 "$NAME" module.prop customize.sh post-fs-data.sh README.md system -x '.git*'
        echo "Built $NAME"
        unzip -l "$NAME"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VollaFlashDual-module
        path: VollaFlashDual-v*.zip
